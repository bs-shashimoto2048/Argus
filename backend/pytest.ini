[pytest]
markers =
    unit: 外部依存やI/Oを持たない高速なテスト
    integration: Backend内部コンポーネント同士を組み合わせた実行時間の長いテスト
    optional_inference: ultralytics/easyocr/pytesseract等の重いAI依存を実際にimportして実行するテスト
    real_auth: 認証(cookie session)そのものを検証するテスト。conftestのADMIN固定(dependency_overrides)を使わない
    hardware: 実カメラ・実GPU等、この実行環境に依存するテスト（通常CIでは実行しない）
addopts = -m "not optional_inference and not hardware"
