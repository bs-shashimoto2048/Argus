name: Inference Smoke (optional)

# ultralytics/easyocr/pytesseract等の重いAI依存を入れてCPU smoke testを実行する。
# 通常のpush/PRごとには実行しない（時間・帯域のコストが大きいため）。手動実行のみ。
# GPU/実カメラに依存するテスト(hardwareマーカー)はGitHub Actionsランナーでは
# 実行できないため対象外のまま。

on:
  workflow_dispatch: {}

jobs:
  optional-inference:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install base + inference dependencies (CPU torch)
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-inference.txt
      - name: pytest -m optional_inference (hardware is still excluded)
        run: python -m pytest -q -m "optional_inference and not hardware"
