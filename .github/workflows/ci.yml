name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install base dependencies
        run: python -m pip install -r requirements.txt
      - name: pytest (unit/integration; optional_inference and hardware are excluded by default)
        run: python -m pytest -q
      - name: compileall
        run: python -m compileall app runtime

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build
